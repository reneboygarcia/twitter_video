name: Update Homebrew Tap Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.8)'
        required: true

permissions:
  contents: read

jobs:
  update-formula:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.version }}
    steps:
      - name: Validate version tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag '$TAG' (expected vX.Y.Z)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: reneboygarcia/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Calculate release archive SHA-256
        id: sha
        run: |
          URL="https://github.com/reneboygarcia/twitter_video/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL --retry 3 "$URL" -o release.tar.gz
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum release.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Render formula from Formula/twitdl.rb
        env:
          URL: ${{ steps.sha.outputs.url }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          sed -e "s|^  url \".*\"|  url \"${URL}\"|" \
              -e "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" \
              Formula/twitdl.rb > homebrew-tap/Formula/twitdl.rb
          grep -qF "url \"${URL}\"" homebrew-tap/Formula/twitdl.rb
          grep -qF "sha256 \"${SHA256}\"" homebrew-tap/Formula/twitdl.rb
          cat homebrew-tap/Formula/twitdl.rb

      - name: Commit and push to homebrew-tap
        working-directory: homebrew-tap
        run: |
          if git diff --quiet; then
            echo "Formula already up to date for ${TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "twitdl ${TAG#v}"
          git push origin HEAD
