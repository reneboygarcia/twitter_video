name: CI (Test + SCA + SBOM)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Set default permissions to read-only for security
permissions:
  contents: read

jobs:
  test:
    name: Run Rust Tests & Audits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy, rustfmt

      - name: Install yt-dlp
        run: |
          pip install yt-dlp
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run unit and integration tests
        run: cargo test

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run linter (clippy)
        run: cargo clippy --all-targets -- -D warnings

  trivy:
    name: Trivy scan & SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results to Code Scanning

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: true

      - name: Run Trivy vulnerability scanner
        run: |
          # Fails the build if CRITICAL or HIGH vulnerabilities are found
          trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1 .

      - name: Generate Trivy SARIF report
        if: always()
        run: |
          trivy fs --format sarif --output trivy-results.sarif --scanners vuln .

      - name: Upload Trivy scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate CycloneDX SBOM
        run: |
          trivy fs -f cyclonedx -o sbom.cyclonedx.json .

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
