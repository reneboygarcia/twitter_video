name: Homebrew Formula Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'Formula/**'
      - '.github/workflows/homebrew-core-audit.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Formula/**'
      - '.github/workflows/homebrew-core-audit.yml'

jobs:
  audit-formula:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

      - name: Audit Homebrew Formula
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/local/homebrew-tap/Formula"
          mkdir -p "$TAP_DIR"
          cp Formula/twitdl.rb "$TAP_DIR/twitdl.rb"
          brew trust --tap local/tap
          HOMEBREW_NO_AUTO_UPDATE=1 brew audit --strict --online local/tap/twitdl
